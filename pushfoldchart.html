<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>13x13 GTO 푸쉬/폴드 차트</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
        }
        
        /* 돌아가기 버튼과 헤더를 위한 레이아웃 */
        .header-container {
            position: relative;
            text-align: center;
            margin-bottom: 5px;
        }
        .btn-back {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: inline-block;
            background-color: #333;
            color: #fff;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            text-decoration: none;
            border: 1px solid #555;
            transition: 0.2s;
        }
        .btn-back:hover {
            background-color: #555;
        }

        h1 {
            margin: 0;
            color: #4CAF50;
            font-size: 1.5em;
        }
        p.subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9em;
            margin-top: 5px;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .form-group {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #bbb;
            font-size: 0.9em;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2c2c2c;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        select:focus {
            border-color: #4CAF50;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2c2c2c;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .percentage {
            color: #4CAF50;
            font-size: 1.1em;
        }
        
        /* 13x13 Grid CSS */
        #range-grid {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 2px;
            background-color: #1a1a1a;
            border-radius: 6px;
            padding: 2px;
        }
        .cell {
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2c2c2c;
            border-radius: 3px;
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.3);
            cursor: default;
            user-select: none;
            transition: all 0.15s ease;
        }
        /* 짝, 수딧, 오프수딧 기본 배경색 */
        .cell.pair { background-color: #333; }
        .cell.suited { background-color: #2a2d33; }
        .cell.offsuit { background-color: #332a2a; }

        /* 활성화(초록불) 상태 */
        .cell.active {
            background-color: #4CAF50;
            color: #fff;
            font-weight: bold;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
        }
        
        .no-data {
            text-align: center;
            color: #ff9800;
            font-style: italic;
            margin-top: 15px;
        }
        
        .range-text {
            margin-top: 15px;
            font-size: 0.85em;
            color: #888;
            word-wrap: break-word;
            text-align: center;
        }
    </style>
</head>

    // --- 1. 13x13 그리드 렌더링 ---
    const gridEl = document.getElementById('range-grid');
    for (let i = 0; i < 13; i++) {
        for (let j = 0; j < 13; j++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            let hand = '';
            
            if (i === j) { // 포켓 페어
                hand = ranks[i] + ranks[j];
                cell.classList.add('pair');
            } else if (i < j) { // 수딧
                hand = ranks[i] + ranks[j] + 's';
                cell.classList.add('suited');
            } else { // 오프수딧
                hand = ranks[j] + ranks[i] + 'o';
                cell.classList.add('offsuit');
            }
            
            cell.id = 'cell-' + hand;
            cell.textContent = hand;
            gridEl.appendChild(cell);
        }
    }

    // --- 2. 텍스트 레인지 파싱 알고리즘 ---
    function getActiveHands(rangeStr) {
        const hands = new Set();
        if (!rangeStr) return hands;

        const cleanStr = rangeStr.toLowerCase();
        
        // "Any Two"일 경우 169 핸드 전체 추가
        if (cleanStr.includes("any two")) {
            for (let i = 0; i < 13; i++) {
                for (let j = 0; j < 13; j++) {
                    if (i === j) hands.add(ranks[i] + ranks[j]);
                    else if (i < j) hands.add(ranks[i] + ranks[j] + 's');
                    else hands.add(ranks[j] + ranks[i] + 'o');
                }
            }
            return hands;
        }

        // 공백이나 콤마로 토큰 분리
        const tokens = rangeStr.replace(/\./g, ',').split(/[\s,]+/);

        tokens.forEach(token => {
            if (!token) return;
            const t = token.toUpperCase().replace(/S/g, 's').replace(/O/g, 'o');
            
            // 1. 포켓 페어 레인지 (예: 22+, 88+)
            if (t.match(/^([AKQJT98765432])\1\+$/i)) {
                const startIdx = ranks.indexOf(t[0]);
                for (let i = startIdx; i >= 0; i--) {
                    hands.add(ranks[i] + ranks[i]);
                }
            }
            // 2. 특정 카드 포함 레인지 (예: Ax, Kx+)
            else if (t.match(/^[AKQJT98765432]x\+?$/i)) {
                const isPlus = t.endsWith('+');
                const startIdx = ranks.indexOf(t[0]);
                const endIdx = isPlus ? 0 : startIdx;
                for (let i = startIdx; i >= endIdx; i--) {
                    const r1 = ranks[i];
                    hands.add(r1 + r1);
                    for (let j = i + 1; j < 13; j++) {
                        hands.add(r1 + ranks[j] + 's');
                        hands.add(r1 + ranks[j] + 'o');
                    }
                }
            }
            // 3. 수딧/오프수딧 레인지 (예: K5s+, QTo+)
            else if (t.match(/^[AKQJT98765432]{2}[so]\+$/i)) {
                const r1 = t[0], r2 = t[1], suit = t[2];
                const r1Idx = ranks.indexOf(r1);
                const r2Idx = ranks.indexOf(r2);
                for (let j = r2Idx; j > r1Idx; j--) {
                    hands.add(r1 + ranks[j] + suit);
                }
            }
            // 4. 구간 지정 레인지 (예: A5s-A4s)
            else if (t.includes('-')) {
                const parts = t.split('-');
                if (parts.length === 2 && parts[0].length === 3 && parts[1].length === 3) {
                    const r1 = parts[0][0], suit = parts[0][2];
                    const idx1 = ranks.indexOf(parts[0][1]);
                    const idx2 = ranks.indexOf(parts[1][1]);
                    const min = Math.min(idx1, idx2), max = Math.max(idx1, idx2);
                    for (let j = min; j <= max; j++) {
                        hands.add(r1 + ranks[j] + suit);
                    }
                }
            }
            // 5. 단일 핸드 지정 (예: 98s, AKo, 77)
            else if (t.match(/^[AKQJT98765432]{2}[so]?$/i)) {
                hands.add(t);
            }
        });
        return hands;
    }

    // --- 3. UI 업데이트 ---
    const bbSelect = document.getElementById('bb-select');
    const posSelect = document.getElementById('pos-select');
    const percentDisplay = document.getElementById('percentage-display');
    const errorMsg = document.getElementById('error-msg');
    const rangeText = document.getElementById('range-text');

    function updateChart() {
        // 기존 초록불 초기화
        document.querySelectorAll('.cell.active').forEach(el => el.classList.remove('active'));
        
        const bb = bbSelect.value;
        const pos = posSelect.value;
        const data = chartData[bb] && chartData[bb][pos];

        if (data) {
            percentDisplay.textContent = data.percent;
            rangeText.textContent = data.range;
            errorMsg.style.display = 'none';
            rangeText.style.display = 'block';
            
            // 파싱된 핸드에 초록불 켜기
            const activeHands = getActiveHands(data.range);
            activeHands.forEach(hand => {
                const cell = document.getElementById('cell-' + hand);
                if (cell) cell.classList.add('active');
            });
        } else {
            percentDisplay.textContent = '-';
            rangeText.style.display = 'none';
            errorMsg.style.display = 'block';
        }
    }

    bbSelect.addEventListener('change', updateChart);
    posSelect.addEventListener('change', updateChart);

    updateChart();
