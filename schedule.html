        // 금액을 만, 억 단위로 변환해 주는 함수
        function formatKoreanCurrency(numStr) {
            if (!numStr || numStr === '-') return numStr;
            let num = parseInt(numStr.replace(/,/g, ''), 10);
            if (isNaN(num)) return numStr;
            if (num === 0) return "0";

            let eok = Math.floor(num / 100000000);
            let man = Math.floor((num % 100000000) / 10000);
            let remainder = num % 10000;

            let result = "";
            if (eok > 0) {
                result += eok.toLocaleString() + "억 ";
            }
            if (man > 0) {
                result += man.toLocaleString() + "만";
            }
            if (eok === 0 && man === 0 && remainder > 0) {
                result += remainder.toLocaleString();
            }
            
            return result.trim();
        }

        // 20BB 레지 시간 계산 (WPL 휴식 시간 룰 적용)
        function calculate20BBRegTime(startTime, name) {
            let durationMinutes = null;
            if (name.includes("워밍업 터보")) durationMinutes = 20;
            else if (name.includes("스텝업") && name.includes("터보")) durationMinutes = 20; 
            else if (name.includes("루키스 터보")) durationMinutes = 8;
            else if (name.includes("데일리 미니 메인") || name.includes("데일리 미니메인")) durationMinutes = 42;
            else if (name.includes("위켄드 빌리언즈 미니")) durationMinutes = 42;
            else if (name.includes("데일리 메인")) durationMinutes = 42;
            else if (name.includes("데일리 스페셜")) durationMinutes = 42;
            else if (name.includes("위켄드 빌리언즈")) durationMinutes = 42;
            else if (name.includes("워밍업")) durationMinutes = 42;
            else if (name.includes("스텝업")) durationMinutes = 20;
            else if (name.includes("프리롤")) durationMinutes = 2;
            else if (name.includes("비기너스")) durationMinutes = 10;
            else if (name.includes("루키스")) durationMinutes = 10;
            else if (name.includes("클래식")) durationMinutes = 42;

            if (durationMinutes === null) return "-";

            let [hours, minutes] = startTime.split(':').map(Number);
            let currentMinuteOfDay = (hours * 60) + minutes;
            let remainingDuration = durationMinutes;

            while (remainingDuration > 0) {
                let currentMinOfHour = currentMinuteOfDay % 60;
                if (currentMinOfHour >= 55 && currentMinOfHour <= 59) {
                    currentMinuteOfDay++;
                } else {
                    currentMinuteOfDay++;
                    remainingDuration--;
                }
            }

            let newHours = Math.floor(currentMinuteOfDay / 60) % 24;
            let newMinutes = currentMinuteOfDay % 60;

            let hh = String(newHours).padStart(2, '0');
            let mm = String(newMinutes).padStart(2, '0');

            return `${hh}:${mm}`;
        }

        // 맥스 레잇 레지 마감 시간을 계산해주는 함수
        function calculateLateRegTime(startTime, name) {
            let durationMinutes = null;
            if (name.includes("워밍업 터보")) durationMinutes = 53;
            else if (name.includes("스텝업 바운티")) durationMinutes = 77;            // 확인 완료 (2026.08.10)
            else if (name.includes("스텝업 터보")) durationMinutes = 45;
            else if (name.includes("루키스 터보")) durationMinutes = 45;
            else if (name.includes("데일리 미니 메인")) durationMinutes = 77;
            else if (name.includes("위켄드 빌리언즈 미니")) durationMinutes = 77;
            else if (name.includes("데일리 메인")) durationMinutes = 89;
            else if (name.includes("데일리 스페셜")) durationMinutes = 89;
            else if (name.includes("위켄드 빌리언즈")) durationMinutes = 89;
            else if (name.includes("워밍업")) durationMinutes = 77;
            else if (name.includes("스텝업")) durationMinutes = 45;
            else if (name.includes("프리롤")) durationMinutes = 10;
            else if (name.includes("비기너스")) durationMinutes = 50;
            else if (name.includes("루키스")) durationMinutes = 55;
            else if (name.includes("클래식")) durationMinutes = 89;

            if (durationMinutes === null) return "-";
            
            let [hours, minutes] = startTime.split(':').map(Number);
            let totalMinutes = (hours * 60) + minutes + durationMinutes;
            
            let newHours = Math.floor(totalMinutes / 60) % 24;
            let newMinutes = totalMinutes % 60;
            
            let hh = String(newHours).padStart(2, '0');
            let mm = String(newMinutes).padStart(2, '0');
            
            return `${hh}:${mm}`;
        }

            ["매일", "23:30", "데일리 스페셜 600억 GTD", "NLH", "300,000,000", "60,000,000,000"]
        ];

        // 객체 형태로 데이터 파싱
        const tournaments = rawData.map((row, index) => {
            let buyInRaw = row[4].replace(/,/g, ''); 
            let buyInValue = buyInRaw === '-' ? 0 : parseInt(buyInRaw, 10); 
            
            let gtdRaw = row[5].replace(/,/g, '');
            let gtdValue = gtdRaw === '-' ? 0 : parseInt(gtdRaw, 10);
            
            let startTime = row[1];
            let name = row[2];
            let type = row[3];
            let actual20BBRegTime = calculate20BBRegTime(startTime, name);
            let actualLateRegTime = calculateLateRegTime(startTime, name);

            // 프라이즈율 계산 
            let prizeRatio = "-";
            let prizeRatioValue = 0;

            if (buyInValue > 0) {
                let ratio = gtdValue / buyInValue;
                prizeRatio = (Math.round(ratio * 10) / 10).toLocaleString() + "배";
                prizeRatioValue = ratio; 
            } else if (buyInRaw === '-') {
                prizeRatioValue = Infinity; 
            }

            return {
                originalIndex: index,
                schedule: row[0],
                time: startTime,
                regi20BB: actual20BBRegTime,
                lateReg: actualLateRegTime,
                name: name,
                type: type,
                buyInString: formatKoreanCurrency(row[4]),
                buyInValue: buyInValue,
                prizeRatio: prizeRatio,
                prizeRatioValue: prizeRatioValue 
            };
        });

        // 현재 화면에 띄워질 데이터 배열
        let currentData = [...tournaments];

        // 정렬 관련 상태
        let currentSortCol = -1; 
        let sortDirection = 'none';

        const tableBody = document.getElementById('tableBody');

        // 테이블 렌더링 함수
        function renderTable(data) {
            tableBody.innerHTML = '';
            
            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7">해당 조건에 맞는 토너먼트가 없습니다.</td></tr>';
                return;
            }

            data.forEach(t => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${t.time}</td>
                    <td class="badge-20bb">${t.regi20BB}</td>
                    <td class="badge-regi">${t.lateReg}</td>
                    <td>${t.name}</td>
                    <td>${t.type}</td>
                    <td>${t.buyInString}</td>
                    <td>${t.prizeRatio}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // 정렬 로직
        function sortTable(colIndex) {
            const tableHeaders = document.querySelectorAll('th');
            
            tableHeaders.forEach(th => {
                let text = th.getAttribute('data-colname');
                th.innerHTML = text; 
            });

            if (currentSortCol === colIndex) {
                if (sortDirection === 'none') sortDirection = 'asc';
                else if (sortDirection === 'asc') sortDirection = 'desc';
                else if (sortDirection === 'desc') sortDirection = 'none';
            } else {
                currentSortCol = colIndex;
                sortDirection = 'asc';
            }

            if (sortDirection === 'none') {
                currentData.sort((a, b) => a.originalIndex - b.originalIndex);
            } else {
                const isAsc = sortDirection === 'asc' ? 1 : -1;
                
                currentData.sort((a, b) => {
                    let valA, valB;
                    
                    switch(colIndex) {
                        case 0: valA = a.time; valB = b.time; break;
                        case 1: valA = a.regi20BB; valB = b.regi20BB; break;
                        case 2: valA = a.lateReg; valB = b.lateReg; break;
                        case 3: valA = a.name; valB = b.name; break;
                        case 4: valA = a.type; valB = b.type; break;
                        case 5: valA = a.buyInValue; valB = b.buyInValue; break;
                        case 6: valA = a.prizeRatioValue; valB = b.prizeRatioValue; break;
                    }

                    if (valA === '-' && valB !== '-') return 1;
                    if (valA !== '-' && valB === '-') return -1;

                    if (typeof valA === 'string') {
                        return valA.localeCompare(valB) * isAsc;
                    } else {
                        return (valA - valB) * isAsc;
                    }
                });

                const indicator = sortDirection === 'asc' ? ' ▲' : ' ▼';
                tableHeaders[colIndex].innerHTML += indicator;
            }

            renderTable(currentData);
        }

        // 필터 로직 적용 (검색 버튼 클릭 및 체크박스 변경 시)
        function applyFilter() {
            const minInput = document.getElementById('minBuyInInput').value;
            const minUnit = parseInt(document.getElementById('minUnitSelect').value, 10);
            
            const maxInput = document.getElementById('maxBuyInInput').value;
            const maxUnit = parseInt(document.getElementById('maxUnitSelect').value, 10);

            const hideBounty = document.getElementById('hideBountyCheck').checked;

            const minBuyIn = minInput ? parseFloat(minInput) * minUnit : 0; 
            const maxBuyIn = maxInput ? parseFloat(maxInput) * maxUnit : Infinity; 

            currentData = tournaments.filter(t => {
                const isBuyInValid = t.buyInValue >= minBuyIn && t.buyInValue <= maxBuyIn;
                
                // 바운티 안 보기 체크 시 타입 또는 토너먼트명에 'Bounty' 또는 '바운티'가 포함되어 있으면 제외
                let isBountyValid = true;
                if (hideBounty) {
                    if (t.type.includes("Bounty") || t.name.includes("바운티")) {
                        isBountyValid = false;
                    }
                }

                return isBuyInValid && isBountyValid;
            });
            
            // 필터를 새로 적용할 때 정렬 상태 초기화
            currentSortCol = -1;
            sortDirection = 'none';
            const tableHeaders = document.querySelectorAll('th');
            tableHeaders.forEach(th => th.innerHTML = th.getAttribute('data-colname'));
            
            renderTable(currentData);
        }

        // 초기화 버튼 클릭 시
        function resetFilter() {
            document.getElementById('minBuyInInput').value = '';
            document.getElementById('minUnitSelect').value = '10000';
            document.getElementById('maxBuyInInput').value = '';
            document.getElementById('maxUnitSelect').value = '10000';
            document.getElementById('hideBountyCheck').checked = false; // 체크박스 해제
            
            currentData = [...tournaments];
            
            // 정렬 상태 초기화
            currentSortCol = -1;
            sortDirection = 'none';
            const tableHeaders = document.querySelectorAll('th');
            tableHeaders.forEach(th => th.innerHTML = th.getAttribute('data-colname'));
            
            renderTable(currentData);
        }

        // 맨 처음 문서 로드 시 렌더링
        renderTable(currentData);
    </script>
