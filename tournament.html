<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPL 토너먼트 트래커</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212; --card-bg: #1e1e1e; --text-main: #ffffff;
            --text-sub: #b3b3b3; --accent: #f6c000;
            --hands-color: #448aff; --win-color: #03dac6; --lose-color: #cf6679;
        }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* 상단 네비게이션(이동 버튼) 스타일 */
        .nav-bar { display: flex; gap: 15px; margin-bottom: 25px; }
        .nav-btn { flex: 1; padding: 15px; text-align: center; text-decoration: none; font-size: 16px; font-weight: bold; border-radius: 8px; border: 1px solid #444; background-color: #252525; color: var(--text-main); transition: 0.2s; }
        .nav-btn:hover { background-color: #333; }
        .nav-btn.active { background-color: var(--accent); color: #000; border-color: var(--accent); }

        .header { border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end;}
        h1 { margin: 0; color: var(--accent); }
        
        .preset-section { background-color: #252525; padding: 12px 20px; border-radius: 8px; border: 1px solid var(--accent); margin-bottom: 20px; display: inline-flex; align-items: center; gap: 15px; }
        .preset-section label { font-weight: bold; color: var(--text-main); font-size: 15px; }
        .preset-section select { padding: 8px 15px; background: #1a1a1a; color: var(--accent); border: 1px solid #444; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .preset-section select:focus { outline: none; border-color: var(--accent); }
        
        /* 이름 변경 버튼 스타일 */
        .btn-rename { background-color: #333; color: #fff; padding: 8px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; border: 1px solid #555; cursor: pointer; transition: 0.2s; min-width: auto; flex: none; }
        .btn-rename:hover { background-color: #555; }
        
        /* 🔥 푸쉬/폴드 차트 이동 버튼 스타일 */
        .btn-chart { background-color: #4CAF50; color: #fff; padding: 8px 15px; font-size: 13px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; transition: 0.2s; text-decoration: none; margin-left: auto; }
        .btn-chart:hover { filter: brightness(0.9); }

        .calculator-section { background-color: var(--card-bg); padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .input-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .input-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 150px; }
        .input-group label { font-weight: bold; color: var(--accent); font-size: 14px; }
        .input-group input { padding: 12px; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 16px; font-weight: bold; text-align: center; }
        .input-group input:focus { outline: none; border-color: var(--accent); }

        .btn-action-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        button { flex: 1; padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; min-width: 150px; }
        .btn-save { background-color: var(--accent); color: #000; }
        .btn-save:hover { filter: brightness(0.9); }
        .btn-clear-calc { background-color: #444; color: #fff; flex: 0.3; min-width: 100px; }
        .btn-clear-calc:hover { background-color: #555; }
        
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background-color: var(--card-bg); padding: 20px; border-radius: 12px; text-align: center; transition: 0.3s; border-top: 3px solid transparent; }
        .card:hover { transform: translateY(-3px); }
        .card h3 { margin: 0 0 10px 0; color: var(--text-sub); font-size: 13px; }
        .card p { margin: 0; font-size: 26px; font-weight: bold; }
        .positive { color: var(--win-color); } .negative { color: var(--lose-color); }
        .gold { color: var(--accent); }
        
        .chart-row { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 900px) { .chart-row { grid-template-columns: 1fr; } }
        .chart-container { background-color: var(--card-bg); padding: 20px; border-radius: 12px; height: 350px; }
        .chart-full { grid-column: 1 / -1; height: 350px; }
        
        .data-table-container { background-color: var(--card-bg); padding: 20px; border-radius: 12px; overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #333; transition: 0.3s; vertical-align: middle; }
        th { color: var(--text-sub); text-align: right; font-size: 14px; }
        th:first-child, td:first-child { text-align: left; padding-left: 10px; }
        th:nth-child(2), td:nth-child(2) { text-align: left; font-weight: bold; color: #fff; }
        th:last-child, td:last-child { text-align: center; width: 80px; }
        .btn-delete { background-color: var(--lose-color); color: #fff; padding: 6px 12px; font-size: 12px; border-radius: 6px; width: auto; border:none; cursor:pointer;}
        .btn-delete:hover { filter: brightness(0.8); }
        .btn-reset-all { background: transparent; border: 1px solid #555; color: #888; padding: 5px 10px; font-size: 12px; float: right; cursor: pointer; transition: 0.2s; }
        .btn-reset-all:hover { color: #fff; border-color: #888; }
        
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-left: 8px; }
        .badge-win { background-color: var(--accent); color: #000; }
        .badge-itm { background-color: rgba(3, 218, 198, 0.2); color: var(--win-color); border: 1px solid var(--win-color); }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-bar">
        <a href="index.html" class="nav-btn">💵 캐시게임 대시보드</a>
        <a href="tournament.html" class="nav-btn active">🏆 토너먼트 대시보드</a>
    </div>

    <div class="header">
        <h1>🏆 WPL 토너먼트 트래커</h1>
    </div>

    <div class="preset-section">
        <label for="presetSelect">📁 기록 장부:</label>
        <select id="presetSelect" onchange="changePreset()">
            <option value="wplTourney_preset1">토너먼트 기록 1</option>
            <option value="wplTourney_preset2">토너먼트 기록 2</option>
            <option value="wplTourney_preset3">토너먼트 기록 3</option>
        </select>
        <button class="btn-rename" onclick="renamePreset()">이름 변경</button>
        <a href="pushfoldchart.html" class="btn-chart">📊 푸쉬/폴드 차트 열기</a>
    </div>

    <div class="calculator-section">
        <div class="input-row">
            <div class="input-group">
                <label for="tDate">날짜</label>
                <input type="text" id="tDate" placeholder="ex) 20260601" oninput="formatDateInput()">
            </div>
            <div class="input-group" style="flex: 2;">
                <label for="tName">토너먼트 명</label>
                <input type="text" id="tName" placeholder="ex) 메인 이벤트, 프리롤, 새틀라이트" style="text-align: left; padding-left: 15px;">
            </div>
            <div class="input-group">
                <label for="tRank">등수 (선택)</label>
                <input type="number" id="tRank" placeholder="ex) 1">
            </div>
        </div>
        <div class="input-row">
            <div class="input-group">
                <label for="tBuyin">바이인 (참가비)</label>
                <input type="text" id="tBuyin" placeholder="0" onkeyup="addCommas(this)">
            </div>
            <div class="input-group">
                <label for="tPrize">획득 상금 (수익)</label>
                <input type="text" id="tPrize" placeholder="0" onkeyup="addCommas(this)">
            </div>
        </div>

        <div class="btn-action-group">
            <button class="btn-save" onclick="saveTournament()">💾 토너먼트 결과 등록</button>
            <button class="btn-clear-calc" onclick="clearInputs()">입력창 비우기</button>
        </div>
    </div>

    <div class="summary-grid">
        <div class="card" style="border-top-color: #fff;"><h3>총 참가 횟수</h3><p id="statCount">0</p></div>
        <div class="card" style="border-top-color: var(--hands-color);"><h3>ITM (입상) 비율</h3><p id="statItm">0.0%</p></div>
        <div class="card" style="border-top-color: var(--accent);"><h3>1등 (우승) 비율</h3><p id="statWin" class="gold">0.0%</p></div>
        <div class="card" style="border-top-color: var(--win-color);"><h3>ROI (투자 수익률)</h3><p id="statRoi">0.0%</p></div>
        <div class="card" style="border-top-color: var(--lose-color);"><h3>총 순수익 (상금-바이인)</h3><p id="statNet">0</p></div>
    </div>

    <div class="chart-row" style="margin-bottom: 20px;">
        <div class="chart-container chart-full">
            <canvas id="profitChart"></canvas>
        </div>
    </div>

    <div class="data-table-container">
        <h3 style="margin-top:0; color:var(--accent); display:inline-block;">토너먼트 참가 내역</h3>
        <button class="btn-reset-all" onclick="clearAllData()">현재 장부 기록 초기화</button>
        <table>
            <thead>
                <tr>
                    <th>날짜</th>
                    <th>토너먼트 명</th>
                    <th>등수</th>
                    <th>바이인</th>
                    <th>획득 상금</th>
                    <th>순수익</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
        </table>
    </div>

</div>

<script>
    let profitChart;
    
    window.onload = function() { 
        loadPresetNames();
        updateDashboard(); 
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('tDate').value = `${yyyy}-${mm}-${dd}`;
    };

    function loadPresetNames() {
        const savedNames = JSON.parse(localStorage.getItem('wplTourneyPresetNames')) || {};
        const selectEl = document.getElementById('presetSelect');
        for (let i = 0; i < selectEl.options.length; i++) {
            const val = selectEl.options[i].value;
            if (savedNames[val]) {
                selectEl.options[i].text = savedNames[val];
            }
        }
    }

    function renamePreset() {
        const selectEl = document.getElementById('presetSelect');
        const currentVal = selectEl.value;
        const currentName = selectEl.options[selectEl.selectedIndex].text;
        
        const newName = prompt('현재 토너먼트 장부의 새로운 이름을 입력하세요:', currentName);
        if (newName && newName.trim() !== '') {
            selectEl.options[selectEl.selectedIndex].text = newName.trim();
            const savedNames = JSON.parse(localStorage.getItem('wplTourneyPresetNames')) || {};
            savedNames[currentVal] = newName.trim();
            localStorage.setItem('wplTourneyPresetNames', JSON.stringify(savedNames));
        }
    }

    function getStorageKey() { return document.getElementById('presetSelect').value; }
    function changePreset() { clearInputs(); updateDashboard(); }

    function formatDateInput() {
        let inputEl = document.getElementById('tDate');
        let rawDate = inputEl.value.replace(/-/g, '').trim();
        if (rawDate.length === 8 && /^\d+$/.test(rawDate)) {
            inputEl.value = rawDate.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
        }
    }

    function addCommas(input) {
        let val = input.value.replace(/[^0-9]/g, '');
        if (val) { input.value = parseInt(val, 10).toLocaleString(); }
    }

    function parseNum(str) {
        if (!str) return 0;
        return parseFloat(str.replace(/,/g, '')) || 0;
    }

    function clearInputs() {
        document.getElementById('tName').value = '';
        document.getElementById('tRank').value = '';
        document.getElementById('tBuyin').value = '';
        document.getElementById('tPrize').value = '';
    }

    function saveTournament() {
        const dateStr = document.getElementById('tDate').value.trim();
        const nameStr = document.getElementById('tName').value.trim() || '이름 없음';
        const rankVal = document.getElementById('tRank').value.trim() ? parseInt(document.getElementById('tRank').value) : null;
        const buyin = parseNum(document.getElementById('tBuyin').value);
        const prize = parseNum(document.getElementById('tPrize').value);

        if (!dateStr || dateStr.length !== 10) return alert('정확한 날짜(YYYY-MM-DD)를 입력해주세요!');
        
        const storageKey = getStorageKey();
        let tourneyData = JSON.parse(localStorage.getItem(storageKey)) || [];

        tourneyData.push({ 
            id: Date.now(), 
            date: dateStr, 
            name: nameStr,
            rank: rankVal,
            buyin: buyin, 
            prize: prize 
        });

        tourneyData.sort((a, b) => new Date(a.date) - new Date(b.date));
        localStorage.setItem(storageKey, JSON.stringify(tourneyData));
        
        updateDashboard();
        clearInputs();
    }

    window.deleteRow = function(id) {
        if(confirm(`이 토너먼트 기록을 삭제하시겠습니까?`)) {
            const storageKey = getStorageKey();
            let tourneyData = JSON.parse(localStorage.getItem(storageKey)) || [];
            tourneyData = tourneyData.filter(item => item.id !== id);
            localStorage.setItem(storageKey, JSON.stringify(tourneyData));
            updateDashboard();
        }
    }

    window.clearAllData = function() {
        const presetName = document.getElementById('presetSelect').options[document.getElementById('presetSelect').selectedIndex].text;
        if(confirm(`[${presetName}]의 모든 토너먼트 기록을 삭제하시겠습니까? (복구 불가)`)) {
            const storageKey = getStorageKey();
            localStorage.removeItem(storageKey);
            updateDashboard();
        }
    }

    function updateDashboard() {
        const storageKey = getStorageKey();
        const data = JSON.parse(localStorage.getItem(storageKey)) || [];
        
        let totalEntries = data.length;
        let totalBuyin = 0;
        let totalPrize = 0;
        let itmCount = 0;
        let winCount = 0;

        const labels = []; 
        const cumProfitData = [];
        let currentCumProfit = 0;
        
        const tbody = document.getElementById('dataTableBody'); 
        tbody.innerHTML = '';

        data.forEach(row => {
            totalBuyin += row.buyin;
            totalPrize += row.prize;
            const netProfit = row.prize - row.buyin;
            currentCumProfit += netProfit;

            if (row.prize > 0) itmCount++;
            if (row.rank === 1) winCount++;

            labels.push(row.date);
            cumProfitData.push(currentCumProfit);

            let nameDisplay = row.name;
            if (row.rank === 1) {
                nameDisplay += ` <span class="badge badge-win">WIN 🏆</span>`;
            } else if (row.prize > 0) {
                nameDisplay += ` <span class="badge badge-itm">ITM 💸</span>`;
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.date}</td>
                <td>${nameDisplay}</td>
                <td>${row.rank ? row.rank + '등' : '-'}</td>
                <td style="color:var(--lose-color);">${row.buyin.toLocaleString()}</td>
                <td style="color:var(--win-color);">${row.prize.toLocaleString()}</td>
                <td class="${netProfit >= 0 ? 'positive' : 'negative'}">${netProfit.toLocaleString()}</td>
                <td>
                    <button class="btn-delete" onclick="deleteRow(${row.id})">삭제</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        const itmRate = totalEntries > 0 ? (itmCount / totalEntries) * 100 : 0;
        const winRate = totalEntries > 0 ? (winCount / totalEntries) * 100 : 0;
        const totalNetProfit = totalPrize - totalBuyin;
        const totalRoi = totalBuyin > 0 ? (totalNetProfit / totalBuyin) * 100 : 0;

        document.getElementById('statCount').innerText = totalEntries.toLocaleString();
        document.getElementById('statItm').innerText = itmRate.toFixed(1) + '%';
        document.getElementById('statWin').innerText = winRate.toFixed(1) + '%';
        
        const roiEl = document.getElementById('statRoi');
        roiEl.innerText = totalRoi.toFixed(1) + '%';
        roiEl.className = totalRoi >= 0 ? 'positive' : 'negative';

        const netEl = document.getElementById('statNet');
        netEl.innerText = totalNetProfit.toLocaleString();
        netEl.className = totalNetProfit >= 0 ? 'positive' : 'negative';

        if(profitChart) profitChart.destroy();
        Chart.defaults.color = '#b3b3b3'; 
        Chart.defaults.font.family = 'Pretendard';

        const ctx1 = document.getElementById('profitChart').getContext('2d');
        profitChart = new Chart(ctx1, { 
            type: 'line', 
            data: { 
                labels: labels, 
                datasets: [{ 
                    label: '토너먼트 누적 순수익', 
                    data: cumProfitData, 
                    borderColor: '#f6c000', 
                    backgroundColor: 'rgba(246, 192, 0, 0.1)', 
                    borderWidth: 3, 
                    fill: true, 
                    tension: 0.1 
                }] 
            }, 
            options: { 
                responsive: true, 
                maintainAspectRatio: false 
            } 
        });
    }
</script>
</body>
</html>
