<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포커 캐시게임 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212; --card-bg: #1e1e1e; --text-main: #ffffff;
            --text-sub: #b3b3b3; --accent: #bb86fc; --hands-color: #448aff; 
            --win-color: #03dac6; --lose-color: #cf6679;
        }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .nav-bar { display: flex; gap: 15px; margin-bottom: 25px; }
        .nav-btn { flex: 1; padding: 15px; text-align: center; text-decoration: none; font-size: 16px; font-weight: bold; border-radius: 8px; border: 1px solid #444; background-color: #252525; color: var(--text-main); transition: 0.2s; }
        .nav-btn:hover { background-color: #333; }
        .nav-btn.active { background-color: var(--accent); color: #000; border-color: var(--accent); }

        .header { border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end;}
        h1 { margin: 0; color: var(--accent); }
        
        .preset-section { background-color: #252525; padding: 12px 20px; border-radius: 8px; border: 1px solid var(--accent); margin-bottom: 20px; display: inline-flex; align-items: center; gap: 15px; flex-wrap: wrap;}
        .preset-section label { font-weight: bold; color: var(--text-main); font-size: 15px; }
        .preset-section select { padding: 8px 15px; background: #1a1a1a; color: var(--accent); border: 1px solid #444; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .preset-section select:focus { outline: none; border-color: var(--accent); }
        
        .btn-rename { background-color: #333; color: #fff; padding: 8px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; border: 1px solid #555; cursor: pointer; transition: 0.2s; min-width: auto; flex: none; }
        .btn-rename:hover { background-color: #555; }

        .calculator-section { background-color: var(--card-bg); padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .calc-header { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .input-group { display: flex; align-items: center; gap: 10px; background: #252525; padding: 10px 15px; border-radius: 8px; border: 1px solid #333; flex: 1; min-width: 250px;}
        .input-group label { font-weight: bold; color: var(--accent); white-space: nowrap; }
        .input-group input { flex: 1; padding: 8px; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 16px; font-weight: bold; text-align: center; }
        .input-group input:focus { outline: none; border-color: var(--accent); }
        
        .unit-group { display: flex; flex: 1; border: 1px solid #444; border-radius: 6px; overflow: hidden; height: 38px; }
        .unit-btn { flex: 1; background: #1a1a1a; color: #fff; border: none; padding: 0; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; min-width: auto; border-right: 1px solid #333;}
        .unit-btn:last-child { border-right: none; }
        .unit-btn:hover { background: #333; }
        .unit-btn.active { background: var(--accent); color: #000; }
        
        .shorthand-hint { font-size: 12px; color: #888; display: block; text-align: center; margin-top: 6px; width: 100%; font-weight: bold;}

        .split-section { display: flex; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .split-section { flex-direction: column; } }
        .column { flex: 1; background-color: #252525; padding: 15px; border-radius: 10px; border: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
        .column h2 { margin: 0; font-size: 16px; text-align: center; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .column.hands h2 { color: var(--hands-color); }
        .column.profit h2 { color: var(--win-color); }
        
        textarea { width: 100%; height: 100px; background-color: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 8px; padding: 12px; font-size: 15px; line-height: 1.5; box-sizing: border-box; resize: none; }
        textarea:focus { outline: none; }
        .column.hands textarea:focus { border-color: var(--hands-color); }
        .column.profit textarea:focus { border-color: var(--win-color); }

        .sum-display { background: #1a1a1a; padding: 10px; border-radius: 6px; text-align: center; font-size: 20px; font-weight: bold; border: 1px solid #444; }
        .column.hands .sum-display { color: var(--hands-color); }
        .column.profit .sum-display.pos { color: var(--win-color); }
        .column.profit .sum-display.neg { color: var(--lose-color); }

        .btn-action-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button { flex: 1; padding: 15px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; min-width: 150px; }
        .btn-add-merge { background-color: #ffb74d; color: #000; }
        .btn-add-merge:hover { filter: brightness(0.9); }
        .btn-save { background-color: var(--accent); color: #000; }
        .btn-save:hover { filter: brightness(0.9); }
        .btn-clear-calc { background-color: #444; color: #fff; flex: 0.3; min-width: 100px; }
        .btn-clear-calc:hover { background-color: #555; }
        
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background-color: var(--card-bg); padding: 20px; border-radius: 12px; text-align: center; transition: 0.3s; }
        .card h3 { margin: 0 0 10px 0; color: var(--text-sub); font-size: 14px; }
        .card p { margin: 0; font-size: 24px; font-weight: bold; transition: color 0.3s; }
        .positive { color: var(--win-color); } .negative { color: var(--lose-color); }
        
        .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-container { background-color: var(--card-bg); padding: 20px; border-radius: 12px; height: 350px; }
        .chart-full { grid-column: 1 / -1; height: 400px; }
        
        .data-table-container { background-color: var(--card-bg); padding: 20px; border-radius: 12px; overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #333; transition: 0.3s; vertical-align: middle; }
        th { color: var(--text-sub); text-align: right; }
        th:first-child, td:first-child { text-align: left; padding-left: 10px; }
        th:nth-child(2), td:nth-child(2) { text-align: right; color: var(--accent); font-size: 13px; }
        th:last-child, td:last-child { text-align: center; width: 140px; }
        
        .action-btns { display: flex; gap: 5px; width: 100%; }
        .btn-edit, .btn-delete, .btn-save-edit, .btn-cancel-edit { flex: 1; padding: 6px 0; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; text-align: center; transition: 0.2s; }
        .btn-edit { background-color: #ffb74d; color: #000; }
        .btn-edit:hover { filter: brightness(0.9); }
        .btn-delete { background-color: var(--lose-color); color: #fff; }
        .btn-delete:hover { filter: brightness(0.8); }
        .btn-save-edit { background-color: var(--win-color); color: #000; }
        .btn-save-edit:hover { filter: brightness(0.9); }
        .btn-cancel-edit { background-color: #444; color: #fff; }
        .btn-cancel-edit:hover { background-color: #555; }
        .btn-reset-all { background: transparent; border: 1px solid #555; color: #888; padding: 5px 10px; font-size: 12px; float: right; cursor: pointer; transition: 0.2s; min-width: auto; }
        .btn-reset-all:hover { color: #fff; border-color: #888; }
        .edit-input { background: #1a1a1a; color: #fff; border: 1px solid var(--accent); border-radius: 4px; padding: 6px; font-family: 'Pretendard', sans-serif; font-size: 13px; box-sizing: border-box; text-align: center; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-bar">
        <a href="index.html" class="nav-btn active">💵 캐시게임 대시보드</a>
        <a href="tournament.html" class="nav-btn">🏆 토너먼트 대시보드</a>
    </div>

    <div class="header">
        <h1>♠️ 포커 대시보드</h1>
    </div>

    <div class="preset-section">
        <label for="presetSelect">📁 기록 장부:</label>
        <select id="presetSelect" onchange="changePreset()">
            <option value="wplData">프리셋 1</option>
            <option value="wplData_preset2">프리셋 2</option>
            <option value="wplData_preset3">프리셋 3</option>
            <option value="wplData_preset4">프리셋 4</option>
        </select>
        <button class="btn-rename" onclick="renamePreset()">이름 변경</button>
    </div>

    <div class="calculator-section">
        <div class="calc-header">
            <div class="input-group">
                <label for="dateInput">날짜</label>
                <input type="text" id="dateInput" placeholder="ex) 20260530" oninput="formatDateInput()">
            </div>
            
            <div class="input-group" style="flex-direction: column; align-items: flex-start;">
                <div style="display: flex; align-items: center; gap: 10px; width: 100%;">
                    <label for="bbInputBase">방 BB 크기</label>
                    <input type="number" id="bbInputBase" placeholder="숫자만 입력" oninput="calculateBB()" style="flex: 1; min-width: 80px;">
                    <div class="unit-group">
                        <button type="button" class="unit-btn active" data-unit="1" onclick="setUnit(this, 1)">x</button>
                        <button type="button" class="unit-btn" data-unit="1000" onclick="setUnit(this, 1000)">K</button>
                        <button type="button" class="unit-btn" data-unit="1000000" onclick="setUnit(this, 1000000)">M</button>
                    </div>
                </div>
                <span class="shorthand-hint">실제 적용 크기: <span id="bbParsedValue" style="color:var(--win-color); font-size:14px;">0</span></span>
            </div>
        </div>
        
        <div class="split-section">
            <div class="column hands">
                <h2>✋ 핸드 수 </h2>
                <textarea id="handsInput" placeholder="숫자들을 띄어쓰기나 엔터로 입력" oninput="updateLiveSums()"></textarea>
                <div class="sum-display" id="handsSum">0</div>
            </div>
            <div class="column profit">
                <h2>💰 해당 방 수익/상금 </h2>
                <textarea id="profitInput" placeholder="숫자들을 띄어쓰기나 엔터로 입력" oninput="updateLiveSums()"></textarea>
                <div class="sum-display" id="profitSum">0</div>
            </div>
        </div>

        <div class="btn-action-group">
            <button class="btn-save" onclick="saveToDashboard('new')">💾 새 데이터 저장</button>
            <button class="btn-add-merge" onclick="saveToDashboard('merge')">📥 기존 날짜/방에 합산</button>
            <button class="btn-clear-calc" onclick="clearCalculator()">입력창 비우기</button>
        </div>
    </div>

    <div class="summary-grid">
        <div class="card"><h3>총 플레이 핸드</h3><p id="totHands">0</p></div>
        <div class="card"><h3>총 누적 BB 수익</h3><p id="totBB">0.00</p></div>
        <div class="card"><h3>통합 BB/100</h3><p id="avgBB">0.00</p></div>
        <div class="card"><h3>총 누적 수익 (화폐)</h3><p id="totProfit">0</p></div>
    </div>

    <div class="chart-row" style="margin-bottom: 20px;">
        <div class="chart-container chart-full"><canvas id="profitChart"></canvas></div>
    </div>

    <div class="data-table-container">
        <h3 style="margin-top:0; color:var(--accent); display:inline-block;">History</h3>
        <button class="btn-reset-all" onclick="clearAllData()">현재 장부 기록 초기화</button>
        <table>
            <thead>
                <tr>
                    <th>날짜</th>
                    <th>방 BB 크기</th>
                    <th>핸드 수</th>
                    <th>해당 세션 BB/100</th>
                    <th>수익 (화폐)</th>
                    <th>누적 수익 (화폐)</th>
                    <th style="text-align:center; width: 120px;">관리</th>
                </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
        </table>
    </div>

    <div class="chart-row">
        <div class="chart-container"><canvas id="bb100Chart"></canvas></div>
        <div class="chart-container"><canvas id="dailyProfitChart"></canvas></div>
    </div>
</div>

<script>
    let profitChart, bb100Chart, dailyProfitChart;
    let currentBBUnit = 1;
    let editingId = null; 
    
    window.onload = function() { 
        loadPresetNames();
        updateDashboard(); 
        
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('dateInput').value = `${yyyy}-${mm}-${dd}`;
    };

    function loadPresetNames() {
        const savedNames = JSON.parse(localStorage.getItem('wplPresetNames')) || {};
        const selectEl = document.getElementById('presetSelect');
        for (let i = 0; i < selectEl.options.length; i++) {
            const val = selectEl.options[i].value;
            if (savedNames[val]) {
                selectEl.options[i].text = savedNames[val];
            }
        }
    }

    function renamePreset() {
        const selectEl = document.getElementById('presetSelect');
        const currentVal = selectEl.value;
        const currentName = selectEl.options[selectEl.selectedIndex].text;
        
        const newName = prompt('현재 장부의 새로운 이름을 입력하세요:', currentName);
        if (newName && newName.trim() !== '') {
            selectEl.options[selectEl.selectedIndex].text = newName.trim();
            const savedNames = JSON.parse(localStorage.getItem('wplPresetNames')) || {};
            savedNames[currentVal] = newName.trim();
            localStorage.setItem('wplPresetNames', JSON.stringify(savedNames));
        }
    }

    function getStorageKey() { return document.getElementById('presetSelect').value; }
    function changePreset() { editingId = null; clearCalculator(); updateDashboard(); }

    function parseAndSum(text) {
        const tokens = text.split(/[\s,]+/);
        let sum = 0;
        tokens.forEach(token => {
            let cleanToken = token.replace(/,/g, '').trim();
            if (cleanToken === '') return;
            let num = parseFloat(cleanToken);
            if (!isNaN(num)) sum += num;
        });
        return sum;
    }

    function formatDateInput() {
        let inputEl = document.getElementById('dateInput');
        let rawDate = inputEl.value.replace(/-/g, '').trim();
        if (rawDate.length === 8 && /^\d+$/.test(rawDate)) {
            inputEl.value = rawDate.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
        }
    }

    function setUnit(btn, multiplier) {
        const buttons = document.querySelectorAll('.unit-btn');
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentBBUnit = multiplier;
        calculateBB();
    }

    function calculateBB() {
        const baseVal = parseFloat(document.getElementById('bbInputBase').value) || 0;
        const actualVal = baseVal * currentBBUnit;
        document.getElementById('bbParsedValue').innerText = actualVal.toLocaleString();
        return actualVal;
    }

    function updateLiveSums() {
        const handsSum = parseAndSum(document.getElementById('handsInput').value);
        const profitSum = parseAndSum(document.getElementById('profitInput').value);
        document.getElementById('handsSum').innerText = handsSum.toLocaleString();
        const profitSumEl = document.getElementById('profitSum');
        profitSumEl.innerText = profitSum.toLocaleString();
        profitSumEl.className = profitSum > 0 ? 'sum-display pos' : (profitSum < 0 ? 'sum-display neg' : 'sum-display');
    }

    function clearCalculator() {
        document.getElementById('handsInput').value = '';
        document.getElementById('profitInput').value = '';
        document.getElementById('bbInputBase').value = '';
        setUnit(document.querySelector('.unit-btn[data-unit="1"]'), 1);
        updateLiveSums();
    }

    function saveToDashboard(mode) {
        const dateStr = document.getElementById('dateInput').value.trim();
        const finalBBSize = calculateBB();
        const finalHands = parseAndSum(document.getElementById('handsInput').value);
        const finalProfit = parseAndSum(document.getElementById('profitInput').value);

        if (!dateStr || dateStr.length !== 10) return alert('날짜를 입력해주세요!');
        if (finalHands === 0 && finalProfit === 0) return alert('핸드 수나 수익을 입력해주세요!');
        if (finalBBSize <= 0) return alert('방 BB 크기를 입력해주세요!');

        const storageKey = getStorageKey();
        let pokerData = JSON.parse(localStorage.getItem(storageKey)) || [];
        
        if (mode === 'merge') {
            let existingIndex = pokerData.findIndex(item => item.date === dateStr && item.bbSize === finalBBSize);
            if (existingIndex !== -1) {
                pokerData[existingIndex].hands += finalHands;
                pokerData[existingIndex].dailyProfit += finalProfit;
            } else {
                pokerData.push({ id: Date.now() + Math.random(), date: dateStr, hands: finalHands, dailyProfit: finalProfit, bbSize: finalBBSize });
            }
        } else {
            pokerData.push({ id: Date.now() + Math.random(), date: dateStr, hands: finalHands, dailyProfit: finalProfit, bbSize: finalBBSize });
        }

        pokerData.sort((a, b) => new Date(a.date) - new Date(b.date));
        localStorage.setItem(storageKey, JSON.stringify(pokerData));
        updateDashboard();
        clearCalculator();
    }

    window.editRow = function(id) { editingId = id; updateDashboard(); }
    window.cancelEdit = function() { editingId = null; updateDashboard(); }

    window.saveEdit = function(id) {
        const dateInput = document.getElementById('edit-date-' + id).value.trim();
        const bbInput = parseFloat(document.getElementById('edit-bb-' + id).value) || 0;
        const handsInput = parseFloat(document.getElementById('edit-hands-' + id).value) || 0;
        const profitInput = parseFloat(document.getElementById('edit-profit-' + id).value) || 0;

        const storageKey = getStorageKey();
        let pokerData = JSON.parse(localStorage.getItem(storageKey)) || [];
        const index = pokerData.findIndex(item => item.id === id);
        
        if (index !== -1) {
            pokerData[index] = { ...pokerData[index], date: dateInput, bbSize: bbInput, hands: handsInput, dailyProfit: profitInput };
            pokerData.sort((a, b) => new Date(a.date) - new Date(b.date));
            localStorage.setItem(storageKey, JSON.stringify(pokerData));
        }
        editingId = null;
        updateDashboard();
    }

    window.deleteRow = function(index) {
        if(confirm(`이 기록을 삭제하시겠습니까?`)) {
            const storageKey = getStorageKey();
            let pokerData = JSON.parse(localStorage.getItem(storageKey)) || [];
            pokerData.splice(index, 1);
            localStorage.setItem(storageKey, JSON.stringify(pokerData));
            updateDashboard();
        }
    }

    window.clearAllData = function() {
        if(confirm(`모든 기록을 삭제하시겠습니까?`)) {
            localStorage.removeItem(getStorageKey());
            updateDashboard();
        }
    }

    function updateDashboard() {
        const storageKey = getStorageKey();
        let data = JSON.parse(localStorage.getItem(storageKey)) || [];
        
        let totalHands = 0; let totalProfit = 0; let totalBBEarned = 0;
        const labels = []; const cumProfitData = []; const bb100Data = []; const dailyProfitData = [];
        
        const tbody = document.getElementById('dataTableBody'); tbody.innerHTML = '';

        data.forEach((row, index) => {
            totalHands += row.hands;
            totalProfit += row.dailyProfit;
            
            let sessionBBEarned = row.bbSize > 0 ? row.dailyProfit / row.bbSize : 0;
            let dynamicBB100 = (row.hands > 0 && row.bbSize > 0) ? (sessionBBEarned / row.hands) * 100 : 0;
            totalBBEarned += sessionBBEarned;

            labels.push(row.date);
            cumProfitData.push(totalProfit);
            bb100Data.push(dynamicBB100);
            dailyProfitData.push(row.dailyProfit);

            const tr = document.createElement('tr');
            if (editingId === row.id) {
                tr.innerHTML = `
                    <td><input type="text" id="edit-date-${row.id}" class="edit-input" value="${row.date}"></td>
                    <td><input type="number" id="edit-bb-${row.id}" class="edit-input" value="${row.bbSize}"></td>
                    <td><input type="number" id="edit-hands-${row.id}" class="edit-input" value="${row.hands}"></td>
                    <td style="color:#555;">-</td>
                    <td><input type="number" id="edit-profit-${row.id}" class="edit-input" value="${row.dailyProfit}"></td>
                    <td style="color:#555;">-</td>
                    <td><div class="action-btns"><button class="btn-save-edit" onclick="saveEdit(${row.id})">저장</button><button class="btn-cancel-edit" onclick="cancelEdit()">취소</button></div></td>
                `;
            } else {
                tr.innerHTML = `
                    <td>${row.date}</td>
                    <td style="color: #b3b3b3;">${row.bbSize.toLocaleString()}</td>
                    <td>${row.hands.toLocaleString()}</td>
                    <td class="${dynamicBB100 >= 0 ? 'positive' : 'negative'}">${dynamicBB100.toFixed(2)}</td>
                    <td class="${row.dailyProfit >= 0 ? 'positive' : 'negative'}">${row.dailyProfit.toLocaleString()}</td>
                    <td class="${totalProfit >= 0 ? 'positive' : 'negative'}">${totalProfit.toLocaleString()}</td>
                    <td><div class="action-btns"><button class="btn-edit" onclick="editRow(${row.id})">편집</button><button class="btn-delete" onclick="deleteRow(${index})">삭제</button></div></td>
                `;
            }
            tbody.appendChild(tr);
        });

        document.getElementById('totHands').innerText = totalHands.toLocaleString();
        document.getElementById('totBB').innerText = totalBBEarned.toFixed(2);
        document.getElementById('totBB').className = totalBBEarned >= 0 ? 'positive' : 'negative';
        document.getElementById('avgBB').innerText = (totalHands > 0 ? (totalBBEarned / totalHands) * 100 : 0).toFixed(2);
        document.getElementById('avgBB').className = (totalHands > 0 && totalBBEarned >= 0) ? 'positive' : (totalHands > 0 ? 'negative' : '');
        document.getElementById('totProfit').innerText = totalProfit.toLocaleString();
        document.getElementById('totProfit').className = totalProfit >= 0 ? 'positive' : 'negative';

        if(profitChart) profitChart.destroy(); if(bb100Chart) bb100Chart.destroy(); if(dailyProfitChart) dailyProfitChart.destroy();

        Chart.defaults.color = '#b3b3b3'; Chart.defaults.font.family = 'Pretendard';
        
        new Chart(document.getElementById('profitChart').getContext('2d'), { type: 'line', data: { labels: labels, datasets: [{ label: '누적 수익', data: cumProfitData, borderColor: '#bb86fc', backgroundColor: 'rgba(187, 134, 252, 0.1)', borderWidth: 3, fill: true, tension: 0.1 }] }, options: { responsive: true, maintainAspectRatio: false } });
        new Chart(document.getElementById('bb100Chart').getContext('2d'), { type: 'bar', data: { labels: labels, datasets: [{ label: '해당 세션 BB/100', data: bb100Data, backgroundColor: bb100Data.map(v => v >= 0 ? '#03dac6' : '#cf6679') }] }, options: { responsive: true, maintainAspectRatio: false } });
        new Chart(document.getElementById('dailyProfitChart').getContext('2d'), { type: 'bar', data: { labels: labels, datasets: [{ label: '당일 수익', data: dailyProfitData, backgroundColor: dailyProfitData.map(v => v >= 0 ? '#03dac6' : '#cf6679') }] }, options: { responsive: true, maintainAspectRatio: false } });
    }
</script>
</body>
</html>
